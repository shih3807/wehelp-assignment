<!DOCTYPE html>
<html lang="TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Page</title>
    <link rel="icon" href="{{url_for('static', path='wehelp-logo.png')}}">
    <link rel="stylesheet" href="{{url_for('static', path='styles.css')}}">
</head>

<body>
    <header>
        <div class="title_text">歡迎光臨，這是會員頁</div>
    </header>
    <main>
        <div class="notification">{{user_name}}，歡迎登入系統</div>
        <a href="/logout"><div class="return_link">登出系統</div></a>
    
    <hr />
    <div class="main_text">快來留言吧</div>
    <form id="createMessageForm" method="POST" action="/createMessage">
        <div class="form_item">
            <label for="message">內容</label>
            <input type="text" id="message" name="message" />
        </div>
        <button type="submit">送出</button>
    </form>
    <hr />
    <div class="message_bar" id="message_bar">
            {% for id, name, content in messages %}
                {% if name == user_name%}
                    <div class="message self" >
                    <div class="name">{{name}}</div>
                    <div class="content">{{content}}</div>
                    <form class="deleteForm" method="POST" action="/deleteMessage">
                        <input type="hidden" name="message_id" value="{{id}}">
                        <button type="submit" class="delete">X</button>
                    </form>
                    </div>
                {% else %}
                    <div class="message" >
                        <div class="name">{{name}}</div>
                        <div class="content">{{content}}</div>
                    </div>
                {% endif %}    
            {% endfor %}
    </div>
    </main>
<script src="{{url_for('static', path = 'main.js')}}" defer></script>
</body>
</html>
